<!DOCTYPE html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #fff; }
  #chart {
    font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    width: 100%;
    height: auto;
    display: block;
  }
  #chart text { fill: #000; }
  .tick line { stroke: #000; }
  .tick text { font-size: 13px; }
  .legend-title { font-size: 14px; font-weight: 700; }
  .legend-label { font-size: 13px; }
</style>
<svg id="chart"></svg>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>

const data = d3.csvParse(csv, d3.autoType);
const ages = data.columns.slice(1);                       // <10 … ≥80
const total = d => d3.sum(ages, k => d[k]);

// Sort states by total population, descending.
data.sort((a, b) => total(b) - total(a));

// ---- Dimensions -----------------------------------------------------------
const width       = 1120;
const marginLeft  = 40;
const marginRight = 20;
const step        = 24;                                   // px per row
const chartTop    = 130;                                  // top axis baseline
const height      = chartTop + data.length * step + 8;

// ---- Scales ---------------------------------------------------------------
const x = d3.scaleLinear()
    .domain([0, d3.max(data, total)])
    .range([marginLeft, width - marginRight]);

const y = d3.scaleBand()
    .domain(data.map(d => d.name))
    .range([chartTop, chartTop + data.length * step])
    .padding(0.22);

const color = d3.scaleOrdinal()
    .domain(ages)
    .range(d3.schemeSpectral[ages.length]);               // red → blue, 9 classes

const series = d3.stack().keys(ages)(data);

// ---- SVG ------------------------------------------------------------------
const svg = d3.select("#chart")
    .attr("viewBox", [0, 0, width, height])
    .attr("preserveAspectRatio", "xMinYMin meet");

// Bars
svg.append("g")
  .selectAll("g")
  .data(series)
  .join("g")
    .attr("fill", d => color(d.key))
  .selectAll("rect")
  .data(D => D)
  .join("rect")
    .attr("x", d => x(d[0]))
    .attr("y", d => y(d.data.name))
    .attr("width", d => x(d[1]) - x(d[0]))
    .attr("height", y.bandwidth());

// Top x-axis (0M … 35M)
svg.append("g")
    .attr("transform", `translate(0,${chartTop})`)
    .call(d3.axisTop(x)
        .tickValues(d3.range(0, x.domain()[1], 5e6))
        .tickFormat(d => d / 1e6 + "M")
        .tickSizeOuter(0))
    .call(g => g.select(".domain").remove());

// Left y-axis (state codes)
svg.append("g")
    .attr("transform", `translate(${marginLeft},0)`)
    .call(d3.axisLeft(y).tickSizeOuter(0))
    .call(g => g.select(".domain").remove());

// ---- Legend ---------------------------------------------------------------
const legend = svg.append("g").attr("transform", `translate(${marginLeft},0)`);

legend.append("text")
    .attr("class", "legend-title")
    .attr("x", 0).attr("y", 24)
    .text("Age (years)");

const swW = 73, swH = 20, swGap = 2, swY = 36;

const item = legend.selectAll(".legend-item")
  .data(ages)
  .join("g")
    .attr("class", "legend-item")
    .attr("transform", (d, i) => `translate(${i * (swW + swGap)},0)`);

item.append("rect")
    .attr("x", 0).attr("y", swY)
    .attr("width", swW).attr("height", swH)
    .attr("rx", 3).attr("ry", 3)
    .attr("fill", d => color(d));

item.append("text")
    .attr("class", "legend-label")
    .attr("x", 0).attr("y", swY + swH + 18)
    .text(d => d);
</script>
